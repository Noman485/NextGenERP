server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Baseline browser hardening. The API also sets these headers for its own
    # responses; nginx adds them to the SPA and static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never serve hidden configuration files or database/backup artifacts from
    # the static root. Without these rules the SPA fallback would answer with
    # index.html and mask the fact that the file is not available.
    location ~ (^|/)\.(?!well-known(?:/|$))[^/]+(/|$) {
        return 404;
    }

    location ~* \.(?:db|sqlite|sqlite3|bak|backup|log|sql|dump|pem|key)$ {
        return 404;
    }

    # SPA routes share names with API paths (e.g. /products, /suppliers). A browser
    # navigation sends Accept: text/html and must get the app shell, while fetch
    # calls (Accept: application/json) are proxied to the backend.
    location ~ ^/(auth|admin|assistant|products|categories|suppliers|orders|purchase-orders|inventory-transactions|health|ml)(/|$) {
        error_page 418 = @spa;
        if ($http_accept ~* "text/html") {
            return 418;
        }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location @spa {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
