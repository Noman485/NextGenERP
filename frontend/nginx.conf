server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routes share names with API paths (e.g. /products, /suppliers). A browser
    # navigation sends Accept: text/html and must get the app shell, while fetch
    # calls (Accept: application/json) are proxied to the backend.
    location ~ ^/(auth|products|categories|suppliers|orders|purchase-orders|inventory-transactions|health|ml)(/|$) {
        error_page 418 = @spa;
        if ($http_accept ~* "text/html") {
            return 418;
        }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @spa {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
